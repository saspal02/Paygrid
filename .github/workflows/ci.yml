name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Install shared library
        working-directory: common-lib
        run: ./mvnw -B install -DskipTests -Djib.skip=true

      - name: Build all services (no tests)
        run: |
          # discovery-service: build only, no image is pushed for it (stays in repo)
          for svc in config-service discovery-service api-gateway-service merchant-service payment-service operations-service vault-service; do
            echo "=== Building $svc ==="
            (cd "$svc" && ./mvnw -B package -DskipTests -Djib.skip=true)
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.x

      - name: Create dummy secrets file for validation
        run: |
          if [ ! -f k8s/k8s-secrets.env ]; then
            cat > k8s/k8s-secrets.env <<'EOF'
          PSQL_USER=paygrid
          PSQL_PASSWORD=dummy
          REDIS_PASSWORD=dummy
          JWT_SECRET=dummy-jwt-secret-for-ci-only-32chars
          WEBHOOK_SECRET=dummy
          PAYMENT_DB_PASSWORD=dummy
          MERCHANT_DB_PASSWORD=dummy
          GITHUB_URI=https://github.com/saspal02/dummy-config-repo.git
          GITHUB_USERNAME=dummy
          CONFIG_PASSWORD=dummy
          EOF
          fi

      - name: Validate Kustomize manifests
        run: |
          kubectl kustomize k8s/ > /tmp/kustomize.yaml
          echo "resources: $(grep -c '^kind:' /tmp/kustomize.yaml)"
