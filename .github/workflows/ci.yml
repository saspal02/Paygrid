name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Install shared library
        working-directory: common-lib
        run: ./mvnw -B install -DskipTests -Djib.skip=true

      - name: Build all services (no tests)
        run: |
          # discovery-service: build only, no image is pushed for it (stays in repo)
          for svc in config-service discovery-service api-gateway-service merchant-service payment-service operations-service vault-service; do
            echo "=== Building $svc ==="
            (cd "$svc" && ./mvnw -B package -DskipTests -Djib.skip=true)
          done

