name: CD

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: docker.io/saspal02

jobs:
  push-images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Github code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install shared library
        working-directory: common-lib
        run: ./mvnw -B install -DskipTests -Djib.skip=true

      - name: Push service images with Jib (latest only)
        env:
          JIB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          JIB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # discovery-service intentionally excluded: stays in repo, no image pushed
          for svc in config-service api-gateway-service merchant-service payment-service operations-service vault-service; do
            echo "=== Pushing $svc ==="
            (cd "$svc" && ./mvnw -B package jib:build -DskipTests \
              -Djib.to.image="$REGISTRY/paygrid-$svc:latest" \
              -Djib.to.auth.username="$JIB_USER" \
              -Djib.to.auth.password="$JIB_PASS")
          done
