apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - infra/namespace.yaml
  - infra/configmap.yaml
  - stateful/postgres.yaml
  - stateful/redis.yaml
  - stateful/kafka.yaml
  - stateful/zipkin.yaml
  - stateful/prometheus.yaml
  - stateful/grafana.yaml
  - stateful/kafka-ui.yaml
  - services/config-service.yaml
  - services/api-gateway.yaml
  - services/merchant-service.yaml
  - services/payment-service.yaml
  - services/operations-service.yaml
  - services/vault-service.yaml

namespace: paygrid-core

images:
  - name: docker.io/saspal02/paygrid-config-service
    newTag: latest
  - name: docker.io/saspal02/paygrid-api-gateway-service
    newTag: latest
  - name: docker.io/saspal02/paygrid-merchant-service
    newTag: latest
  - name: docker.io/saspal02/paygrid-payment-service
    newTag: latest
  - name: docker.io/saspal02/paygrid-operations-service
    newTag: latest
  - name: docker.io/saspal02/paygrid-vault-service
    newTag: latest

secretGenerator:
  - name: app-secrets
    namespace: paygrid-core
    envs:
      - k8s-secrets.env

generatorOptions:
  disableNameSuffixHash: true
